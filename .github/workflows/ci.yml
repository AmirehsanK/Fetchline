name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Sections are pushed one after another; only the newest push needs a verdict.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Fetchline.slnx

      # Warnings are errors, so this is also the lint.
      - name: Build
        run: dotnet build Fetchline.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Fetchline.slnx -c Release --no-build
