name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Sections are pushed one after another; only the newest push needs a verdict.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Fetchline.slnx

      # Warnings are errors, so this is also the lint.
      - name: Build
        run: dotnet build Fetchline.slnx -c Release --no-restore

      # Unit tests, and the conformance project, which runs every official test program.
      - name: Test
        run: dotnet test Fetchline.slnx -c Release --no-build

      # The same official tests through the command line, as a user would run them. It exits
      # non-zero if a test fails, or if an excluded test has started to pass.
      - name: Official RISC-V tests on the reference machine
        run: >-
          dotnet run --project src/Fetchline.Cli -c Release --no-build --
          test tests/vectors/riscv-tests/elf --exclusions tests/conformance-exclusions.txt

      # And on the pipeline, with the reference machine checking every instruction it commits.
      - name: Official RISC-V tests on the pipeline, in lockstep
        run: >-
          dotnet run --project src/Fetchline.Cli -c Release --no-build --
          test tests/vectors/riscv-tests/elf --exclusions tests/conformance-exclusions.txt --pipeline
