name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Sections are pushed one after another; only the newest push needs a verdict.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Fetchline.slnx

      # Warnings are errors, so this is also the lint.
      - name: Build
        run: dotnet build Fetchline.slnx -c Release --no-restore

      # Unit tests, and the conformance project, which runs every official test program.
      - name: Test
        run: dotnet test Fetchline.slnx -c Release --no-build

      # The same official tests through the command line, as a user would run them. It exits
      # non-zero if a test fails, or if an excluded test has started to pass.
      - name: Official RISC-V tests on the reference machine
        run: >-
          dotnet run --project src/Fetchline.Cli -c Release --no-build --
          test tests/vectors/riscv-tests/elf --exclusions tests/conformance-exclusions.txt

      # And on the pipeline, with the reference machine checking every instruction it commits.
      - name: Official RISC-V tests on the pipeline, in lockstep
        run: >-
          dotnet run --project src/Fetchline.Cli -c Release --no-build --
          test tests/vectors/riscv-tests/elf --exclusions tests/conformance-exclusions.txt --pipeline

      # Once more on a pipeline with every switch moved off its default. The test projects run
      # all 64 correct configurations; this is the one a user would type.
      - name: Official RISC-V tests on the pipeline built the other way
        run: >-
          dotnet run --project src/Fetchline.Cli -c Release --no-build --
          test tests/vectors/riscv-tests/elf --exclusions tests/conformance-exclusions.txt --pipeline
          --hazards stall --branch id --predictor 2-bit --btb 16 --muldiv 3

      # The playground as it would be served: trimmed and compressed. Publishing writes a gzip
      # and a Brotli copy beside every file, so the download is a matter of adding up. The
      # figure in docs/CPU.md is 2.2 MB with Brotli; a build past 3 MB has gained something it
      # should not have, and fails here.
      - name: Publish the playground and measure the download
        run: |
          dotnet publish src/Fetchline.Web -c Release -o artifacts/site --nologo
          cd artifacts/site/wwwroot
          total() { find . -type f "$@" -printf '%s\n' | awk '{ sum += $1 } END { print sum + 0 }'; }
          plain=$(total ! -name '*.br' ! -name '*.gz')
          gzip=$(total -name '*.gz')
          brotli=$(total -name '*.br')
          echo "The playground: $plain bytes as they are, $gzip with gzip, $brotli with Brotli"
          test "$brotli" -gt 0
          test "$brotli" -lt 3000000
